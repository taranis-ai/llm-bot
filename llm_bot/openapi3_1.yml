openapi: 3.1.0
info:
  title: LLM Bot for Taranis AI
  description: |
    Multi-route LLM-backed bot service for Taranis AI.

    The current implementation exposes embeddings, sentiment analysis, title generation, translation,
    summarization, clustering, named entity recognition, entity linking, entity relationship
    extraction, graph query generation, general chat, grounded HRAG answering, and
    cybersecurity classification. Topic, relevance and sentiment require English and use embedded Laya;
    language detection uses local Lingua. Other tasks use OpenAI-compatible APIs.

    Canonical paths are documented without a trailing slash. The service
    accepts both forms.
  version: 0.0.0
  contact:
    name: Taranis AI
    url: https://github.com/taranis-ai/llm-bot
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12

servers:
  - url: /
    description: Current server

paths:
  /ready:
    get:
      tags: [System]
      summary: Readiness of the embedded English Laya checkpoint
      responses:
        "200":
          description: The English checkpoint is resident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: The English checkpoint is not loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /classify:
    post:
      tags: [Local analysis]
      summary: Classify the primary topic
      operationId: classifyText
      description: |
        English text is required with either backend. Local language detection runs before
        inference; non-English or inconclusive (und) input returns 400. Short fragments,
        identifiers and mixed-language text may be inconclusive. Call /translate with
        target_language="en" first and submit its translation as text. Translation is never
        automatic and requires the configured LLM backend. Supply more English prose when
        detection is inconclusive. The response format is unchanged.
        Six competing primary categories with scores summing to one. Main focus decides overlaps:
        a newly disclosed flaw is vulnerabilities, campaign analysis is attacks, and a hospital
        reporting a breach is incidents. Cybersecurity legislation is politics and a security
        company acquisition is business. Relevance is assessed separately by /cybersec-classification.
        Uses embedded Laya. Rejects inputs exceeding LOCAL_MAX_INPUT_CHARS (default 50000) or the
        English model token budget including question overhead (512 total tokens).
        No silent truncation. Only the text field is accepted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalTextRequest"
      responses:
        "200":
          description: Validated result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationResponse"
        "400":
          description: Invalid, blank, overlong, non-English or inconclusive input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing bearer token
        "502":
          description: Invalid model output or unexpected processing error
        "503":
          description: Local inference busy or unavailable; retry with backoff
  /language:
    post:
      tags: [Local analysis]
      summary: Detect language locally
      operationId: detectLanguage
      description: |
        Returns an ISO 639-1 language code, or und when inconclusive. Uses local Lingua.
        Short text (fewer than 20 usable letters), URL/identifier-dominated text (under 50%
        usable letters), uncertain detection or substantial mixing returns und. A dominant
        language needs 80% of confidently identified sentence text; sentences shorter than 20 letters are ignored.
        Blank input and text exceeding LOCAL_MAX_INPUT_CHARS (default 50000) return 400.
        Only the text field is accepted. No weights download is needed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalTextRequest"
      responses:
        "200":
          description: Validated result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageResponse"
        "400":
          description: Invalid, blank or overlong input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing bearer token
        "502":
          description: Invalid model output or unexpected processing error
        "503":
          description: Local inference busy or unavailable; retry with backoff
  /docs:
    get:
      tags:
        - System
      summary: Interactive Swagger UI
      description: Renders interactive API documentation using the service's OpenAPI document.
      operationId: swaggerDocs
      responses:
        "200":
          description: HTML page that renders the OpenAPI spec with Swagger UI
          content:
            text/html:
              schema:
                type: string

  /openapi.yaml:
    get:
      tags:
        - System
      summary: OpenAPI document
      description: Returns the service's OpenAPI 3.1 specification in YAML with the running package version.
      operationId: openapiDocument
      responses:
        "200":
          description: OpenAPI 3.1 YAML document for this service
          content:
            application/yaml:
              schema:
                type: string

  /chat:
    post:
      tags:
        - Chat
      summary: Generate a general chat response
      description: |
        Accepts a latest user message and optional prior user/assistant messages.
        The service is stateless; prior messages apply only to the current request.
        The response includes the configured model identifier when one is set.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: createChatResponse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            example:
              message: "What should I do next?"
              messages:
                - role: user
                  content: "Help me plan a release."
                - role: assistant
                  content: "Start by running the validation suite."
      responses:
        "200":
          description: Chat response generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid chat request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "502":
          description: Upstream LLM or parsing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to generate chat response"

  /hrag:
    post:
      tags:
        - Grounded Answering
      summary: Answer a question from supplied hybrid evidence
      description: |
        Produces an answer grounded only in caller-supplied document passages
        and graph facts. Every evidence item requires an ID that is unique
        across both lists and a source reference. Returned citations are
        validated against those IDs. No retrieval, embeddings, graph access, or
        persistence is performed by this endpoint.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: createGroundedAnswer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HragRequest"
            example:
              question: "Who operates the service?"
              passages:
                - id: "passage-1"
                  source: "report.pdf#page=2"
                  text: "Example Corp operates the service."
              graph_facts:
                - id: "fact-1"
                  source: "graph://service/42"
                  fact: "Example Corp -[OPERATES]-> Service 42"
      responses:
        "200":
          description: Grounded answer generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HragResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid HRAG request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "502":
          description: Upstream LLM, parsing, or citation validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to generate grounded answer"

  /embed:
    post:
      tags:
        - Embeddings
      summary: Create an embedding for input text
      description: |
        Sends one text to the separately configured OpenAI-compatible embedding
        service and returns its first embedding vector.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: createEmbedding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
            example:
              text: "Text to embed"
      responses:
        "200":
          description: Embedding created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid embedding request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "502":
          description: Upstream embedding service or response validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to create embedding"

  /sentiment:
    post:
      tags:
        - Sentiment
      summary: Analyze sentiment for input text
      description: |
        English text is required with either backend. Local language detection runs before
        inference; non-English or inconclusive (und) input returns 400. Short fragments,
        identifiers and mixed-language text may be inconclusive. Call /translate with
        target_language="en" first and submit its translation as text. Translation is never
        automatic and requires the configured LLM backend. Supply more English prose when
        detection is inconclusive. The response format is unchanged.
        Uses in-process Laya by default (TEXT_ANALYSIS_BACKEND=laya). Existing reasoning
        options are accepted but ignored locally. Blank/overlong inputs return 400;
        the English checkpoint's 512-token budget includes task question overhead.
        No truncation or remote fallback occurs. TEXT_ANALYSIS_BACKEND=llm restores
        the previous upstream implementation. Probabilities are estimates and may be miscalibrated.
        Accepts input text and returns a high-level sentiment label with a
        selected-label probability, not the SDK entropy-based confidence. Factual
        negative-event reporting should be neutral; sentiment is separate from severity.

        When `include_emotions` is true, the response also includes zero or
        more Plutchik emotions that are compatible with the predicted
        sentiment. The `emotions` value must be an array, never null.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: analyzeSentiment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SentimentRequest"
            examples:
              basic:
                summary: Example sentiment request
                value:
                  text: "The launch was a success."
              withEmotions:
                summary: Example sentiment request with emotions
                value:
                  text: "The breach left customers angry and alarmed."
                  include_emotions: true
                  reasoning_effort: "high"
                  thinking_budget_tokens: 256
      responses:
        "200":
          description: Sentiment analyzed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentResponse"
        "400":
          description: Invalid input, or text is non-English or cannot be identified as English
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid sentiment request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "503":
          description: Local inference busy or unavailable; retry with backoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream LLM or parsing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to analyze sentiment"

  /cybersec-classification:
    post:
      tags:
        - Classification
      summary: Classify whether input text is cybersecurity-related
      description: |
        English text is required with either backend. Local language detection runs before
        inference; non-English or inconclusive (und) input returns 400. Short fragments,
        identifiers and mixed-language text may be inconclusive. Call /translate with
        target_language="en" first and submit its translation as text. Translation is never
        automatic and requires the configured LLM backend. Supply more English prose when
        detection is inconclusive. The response format is unchanged.
        Uses in-process Laya by default (TEXT_ANALYSIS_BACKEND=laya). Existing reasoning
        options are accepted but ignored locally. Blank/overlong inputs return 400;
        the English checkpoint's 512-token budget includes task question overhead.
        No truncation or remote fallback occurs. TEXT_ANALYSIS_BACKEND=llm restores
        the previous upstream implementation. Probabilities are estimates and may be miscalibrated.
        Accepts plain text and returns scores for `cybersecurity` and
        `non-cybersecurity`.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: classifyCybersecurityText
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CybersecClassificationRequest"
            examples:
              basic:
                summary: Example cybersec classification request
                value:
                  text: "The newest development in malware automation is concerning."
                  reasoning_effort: "high"
                  thinking_budget_tokens: 256
      responses:
        "200":
          description: Text classified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CybersecClassificationResponse"
        "400":
          description: Invalid input, or text is non-English or cannot be identified as English
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid cybersec classification request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "503":
          description: Local inference busy or unavailable; retry with backoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream LLM or parsing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to classify text for cybersecurity relevance"


  /title:
    post:
      tags:
        - Title
      summary: Generate a concise story title from input text
      description: |
        Accepts input text and returns a concise title.

        When `language` is provided, the title is generated in that language.
        When omitted and `news_items` are used, the service uses the majority
        `news_items[*].language` value when available. Otherwise it falls back
        to the input text language.

        The model is instructed to stay within the request `max_chars` field, which defaults to 100 when omitted. The service does not truncate longer model outputs.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: generateTitle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TitleRequest"
            examples:
              basic:
                summary: Example title request
                value:
                  news_items:
                    - title: "Apple announced new Mac hardware during its developer event in Cupertino."
                      content: "The company introduced updates across the Mac lineup."
                      language: "en"
                  language: "de"
                  max_chars: 100
                  reasoning_effort: "high"
                  thinking_budget_tokens: 256
      responses:
        "200":
          description: Title generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid title request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "502":
          description: Upstream LLM or parsing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to generate title"

  /translate:
    post:
      tags:
        - Translation
      summary: Translate input text into a target language
      description: |
        Accepts plain text and returns a faithful translation into the requested
        target language.

        When `source_language` is omitted, local detection supplies the source language;
        inconclusive detection leaves identification to the translation model. Use target_language="en"
        before calling /classify, /sentiment or /cybersec-classification. Translation requires LLM_* settings.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: translateText
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateRequest"
            examples:
              explicitSource:
                summary: Example translation request with explicit source language
                value:
                  text: "Guten Morgen"
                  source_language: "de"
                  target_language: "en"
                  reasoning_effort: "high"
                  thinking_budget_tokens: 256
              autodetectSource:
                summary: Example translation request with automatic source detection
                value:
                  text: "Bonjour"
                  target_language: "en"
      responses:
        "200":
          description: Translation generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslateResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid translate request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "502":
          description: Upstream LLM or parsing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to translate text"

  /summarize:
    post:
      tags:
        - Summarization
      summary: Summarize input stories
      description: |
        Accepts story news items and returns a summarized version.

        When `language` is provided, the summary is generated in that language.
        When omitted and `news_items` are used, the service uses the majority
        `news_items[*].language` value when available. Otherwise it falls back
        to the input text language.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: summarizeText
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummarizeRequest"
            examples:
              basic:
                summary: Example summarize request
                value:
                  news_items:
                    - title: "Story title"
                      content: "This is the input text to summarize."
                      language: "en"
                  language: "de"
                  max_words: 80
                  reasoning_effort: "high"
                  thinking_budget_tokens: 256
      responses:
        "200":
          description: Summary generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummarizeResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid summarize request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "502":
          description: Upstream LLM or parsing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to generate summary"

  /ner:
    post:
      tags:
        - NER
      summary: Extract named entities from input text
      description: |
        Accepts input text and extracts named entities.

        When `cybersecurity` is enabled, the extraction includes
        cybersecurity-relevant entities in addition to general named entities.

        This endpoint performs extraction only. It does not run entity linking.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: extractEntities
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NerRequest"
            examples:
              basic:
                summary: Example NER request
                value:
                  text: "Microsoft announced that Outlook users in Vienna should install updates immediately."
                  cybersecurity: false
              cybersecurity:
                summary: Example cybersecurity-aware NER request
                value:
                  text: "APT29 used Mimikatz and PowerShell to dump credentials from government systems."
                  cybersecurity: true
                  reasoning_effort: "high"
                  thinking_budget_tokens: 256
      responses:
        "200":
          description: Entities extracted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NerResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid NER request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "502":
          description: Upstream LLM or parsing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to extract entities"

  /ner-link:
    post:
      tags:
        - NER
      summary: Extract and link named entities from input text
      description: |
        Accepts input text, extracts named entities, and resolves them against
        the configured lookup service.

        This endpoint combines NER and linking in one call and returns the
        structured linked-entity response. If NER finds no entities, it returns
        an empty entities array without lookup or disambiguation requests.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: extractAndLinkEntities
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NerLinkRequest"
            examples:
              deterministic:
                summary: Example deterministic NER and linking request
                value:
                  text: "Apple announced new Mac hardware during its developer event in Cupertino."
                  language: "en"
                  linking_mode: "deterministic"
              llm:
                summary: Example LLM NER and linking request
                value:
                  text: "Apple announced new Mac hardware during its developer event in Cupertino."
                  language: "en"
                  linking_mode: "llm"
                  reasoning_effort: "high"
                  thinking_budget_tokens: 256
      responses:
        "200":
          description: Entities extracted and linked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedNerResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid NER link request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "502":
          description: Upstream NER, lookup, or disambiguation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to extract and link entities"

  /link:
    post:
      tags:
        - Linking
      summary: Link known entities to Wikidata candidates
      description: |
        Accepts source text plus a list of known entities and resolves them
        against the configured lookup service.

        This endpoint performs linking only. It does not run NER first.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: linkEntities
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequest"
            examples:
              deterministic:
                summary: Example deterministic linking request
                value:
                  text: "Apple announced new Mac hardware during its developer event in Cupertino."
                  language: "en"
                  linking_mode: "deterministic"
                  entities:
                    - mention: "Apple"
                      type: "ORG"
                    - mention: "Cupertino"
                      type: "GPE"
                    - mention: "Mac"
                      type: "PRODUCT"
              llm:
                summary: Example LLM linking request
                value:
                  text: "Apple announced new Mac hardware during its developer event in Cupertino."
                  language: "en"
                  linking_mode: "llm"
                  reasoning_effort: "high"
                  thinking_budget_tokens: 256
                  entities:
                    - mention: "Apple"
                      type: "ORG"
                    - mention: "Cupertino"
                      type: "GPE"
                    - mention: "Mac"
                      type: "PRODUCT"
      responses:
        "200":
          description: Entities linked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedNerResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid link request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "502":
          description: Lookup or disambiguation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to link entities"

  /cluster:
    post:
      tags:
        - Clustering
      summary: Cluster stories into event groups
      description: |
        Accepts a batch of stories and returns event clusters in the shape
        expected by the existing Taranis story bot integration.
        Each story requires its original ID and a name-keyed tags dictionary,
        which may be empty. Clustering uses only summaries and tags; other story
        fields are ignored. Summaries may be omitted, null, or empty and are
        truncated to CLUSTER_MAX_CONTENT_CHARS_PER_STORY (default: 800 characters)
        before being sent to the model. Returned clusters use the original IDs.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: clusterStories
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterRequest"
            examples:
              basic:
                summary: Example clustering request
                value:
                  stories:
                    - id: "s1"
                      tags:
                        APT29:
                          tag_type: "APT"
                      summary: "APT29 targeted Microsoft users in Vienna."
                    - id: "s2"
                      tags:
                        Microsoft:
                          tag_type: "Organization"
                      summary: "Users in Vienna were targeted in an APT29 campaign."
                  reasoning_effort: "high"
                  thinking_budget_tokens: 256
      responses:
        "200":
          description: Stories clustered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid Cluster request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "502":
          description: Upstream LLM or parsing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to cluster stories"

  /entity-relation-extraction:
    post:
      tags:
        - Entity Relationship Extraction
      summary: Extract schema-constrained entities and relationships
      description: |
        Extracts only entity and directed relation types allowed by the supplied schema.
        Relations must obey their configured source and target entity type constraints.
        The service extracts only information explicitly stated in the input text;
        it does not infer facts or use external knowledge.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: extractEntityRelationships
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityRelationshipExtractionRequest"
            example:
              text: "APT28 exploited CVE-2025-1234."
              schema:
                entity_types:
                  - name: ThreatActor
                    description: A named threat actor
                  - name: Vulnerability
                    description: A named vulnerability
                relation_types:
                  - name: EXPLOITS
                    source_types: [ThreatActor]
                    target_types: [Vulnerability]
      responses:
        "200":
          description: Schema-valid entities and relationships extracted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityRelationshipExtractionResponse"
        "400":
          description: Invalid request or extraction schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid entity relationship extraction request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream LLM or output validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to extract entity relationships"

  /graph-query-generation:
    post:
      tags:
        - Graph Query Generation
      summary: Generate a schema-constrained read-only Cypher query
      description: |
        Generates AGE-compatible read-only Cypher and a separate parameters object
        from a natural-language question and caller-supplied graph schema. The
        service validates labels, relationship directions, properties, parameters,
        prohibited clauses, and the bounded LIMIT. Every relationship must have
        an explicit allowed type, and RETURN must contain one expression aliased
        as result. It does not execute the query,
        access PostgreSQL, or persist data. `graph_name` is passed to the model only
        as caller context and is never embedded in the generated Cypher.

        This endpoint can be protected with a Bearer token using the `API_KEY`
        environment variable.
      operationId: generateGraphQuery
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphQueryGenerationRequest"
            example:
              question: Which organization employs Alice?
              graph_name: knowledge_graph
              schema:
                node_labels:
                  - label: Person
                    properties:
                      - name: name
                        type: string
                  - label: Organization
                    properties:
                      - name: name
                        type: string
                relationship_types:
                  - type: WORKS_AT
                    source_labels: [Person]
                    target_labels: [Organization]
                    properties: []
                default_limit: 25
                maximum_limit: 100
      responses:
        "200":
          description: A validated read-only Cypher query was generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphQueryGenerationResponse"
              example:
                cypher: "MATCH (p:Person)-[:WORKS_AT]->(o:Organization) WHERE p.name = $person_name RETURN o.name AS result LIMIT 25"
                parameters:
                  person_name: Alice
                explanation: Returns organizations that employ the named person.
        "400":
          description: Invalid question or graph schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid graph query generation request payload"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream LLM or generated-query validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Failed to generate graph query"

  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Returns the service's liveness status without checking upstream dependencies.
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok

  /info:
    get:
      tags:
        - System
      summary: Runtime information
      description: Returns the package version, available endpoints, supported modes, and active non-secret configuration.
      operationId: serviceInfo
      responses:
        "200":
          description: Discoverable service information and active non-secret config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  schemas:
    LocalTextRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: Non-whitespace text; configurable character and model token limits apply.
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, laya_ready]
      properties:
        status:
          type: string
          enum: [ok, loading]
        laya_ready:
          type: boolean
    LanguageResponse:
      type: object
      additionalProperties: false
      required: [language]
      properties:
        language:
          type: string
          pattern: '^(?:[a-z]{2}|und)$'
          description: ISO 639-1 code, or und for inconclusive detection
    ClassificationResponse:
      type: object
      additionalProperties: false
      required: [category, scores]
      properties:
        category:
          type: string
          enum: [vulnerabilities, attacks, incidents, politics, business, other]
        scores:
          type: object
          additionalProperties: false
          description: Competing probabilities summing to one; category has a maximum score.
          required: [vulnerabilities, attacks, incidents, politics, business, other]
          properties:
            vulnerabilities:
              type: number
              minimum: 0
              maximum: 1
            attacks:
              type: number
              minimum: 0
              maximum: 1
            incidents:
              type: number
              minimum: 0
              maximum: 1
            politics:
              type: number
              minimum: 0
              maximum: 1
            business:
              type: number
              minimum: 0
              maximum: 1
            other:
              type: number
              minimum: 0
              maximum: 1
    ChatMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
          minLength: 1
    ChatRequest:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
        messages:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/ChatMessage"
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"
    ChatResponse:
      type: object
      additionalProperties: false
      required:
        - answer
        - model
      properties:
        answer:
          type: string
          minLength: 1
        model:
          type:
            - string
            - "null"
          description: Configured model identifier, or null when the provider selects its default
    HragDocumentPassage:
      type: object
      additionalProperties: false
      required:
        - id
        - source
        - text
      properties:
        id:
          type: string
          minLength: 1
          description: Caller-supplied stable evidence ID
        source:
          type: string
          minLength: 1
          description: Caller-supplied source reference
        text:
          type: string
          minLength: 1
    HragGraphFact:
      type: object
      additionalProperties: false
      required:
        - id
        - source
        - fact
      properties:
        id:
          type: string
          minLength: 1
          description: Caller-supplied stable evidence ID
        source:
          type: string
          minLength: 1
          description: Caller-supplied source reference
        fact:
          type: string
          minLength: 1
          description: A graph fact or relationship represented as text
    HragRequest:
      type: object
      additionalProperties: false
      required:
        - question
        - passages
        - graph_facts
      properties:
        question:
          type: string
          minLength: 1
        passages:
          type: array
          items:
            $ref: "#/components/schemas/HragDocumentPassage"
        graph_facts:
          type: array
          items:
            $ref: "#/components/schemas/HragGraphFact"
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"
    HragResponse:
      type: object
      additionalProperties: false
      required:
        - answer
        - citations
        - insufficient_evidence
      properties:
        answer:
          type: string
          minLength: 1
        citations:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Supplied evidence IDs that directly support the answer
        insufficient_evidence:
          type: boolean
          description: True when the supplied evidence cannot support a reliable answer
    EmbedRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Text to embed
    EmbedResponse:
      type: object
      additionalProperties: false
      required:
        - embedding
      properties:
        embedding:
          type: array
          minItems: 1
          items:
            type: number
          description: Embedding vector returned by the configured service
    ReasoningEffort:
      type: string
      nullable: true
      minLength: 1
      description: |
        Optional reasoning effort for the upstream model request. The service
        forwards this as `reasoning.effort` in `responses` mode and as
        `reasoning_effort` in `chat_completions` mode. Accepted but ignored for local Laya analysis.
    ThinkingBudgetTokens:
      type: integer
      minimum: 0
      nullable: true
      description: |
        Optional provider-specific reasoning budget forwarded upstream unchanged
        as `thinking_budget_tokens`. This is intended for compatible servers such
        as `llama.cpp`; other OpenAI-compatible servers may reject it. Ignored by local Laya analysis.
    SentimentRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: English text to analyze for sentiment; translate other languages first
        include_emotions:
          type: boolean
          default: false
          description: |
            When true, include zero or more Plutchik emotions in the response.
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"
    CybersecClassificationRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: English text to classify for cybersecurity relevance; translate other languages first
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"
    CybersecClassificationResponse:
      type: object
      additionalProperties: false
      required:
        - cybersecurity
        - non-cybersecurity
      properties:
        cybersecurity:
          type: number
          minimum: 0
          maximum: 1
        non-cybersecurity:
          type: number
          minimum: 0
          maximum: 1
    SentimentResult:
      type: object
      additionalProperties: false
      required:
        - label
        - score
      properties:
        label:
          type: string
          enum:
            - positive
            - negative
            - neutral
        score:
          type: number
          minimum: 0
          maximum: 1
        emotions:
          type: array
          nullable: true
          uniqueItems: true
          items:
            type: string
            enum:
              - anger
              - fear
              - sadness
              - disgust
              - surprise
              - anticipation
              - trust
              - joy
    SentimentResponse:
      type: object
      additionalProperties: false
      required:
        - sentiment
      properties:
        sentiment:
          $ref: "#/components/schemas/SentimentResult"
    InfoResponse:
      type: object
      additionalProperties: false
      required:
        - package_name
        - package_version
        - reasoning_profiles
        - linking_modes
        - endpoints
        - current
      properties:
        package_name:
          type: string
        package_version:
          type: string
        reasoning_profiles:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required:
              - description
            properties:
              description:
                type: string
        linking_modes:
          type: array
          items:
            type: string
        endpoints:
          type: object
          additionalProperties:
            type: string
        current:
          type: object
          additionalProperties: true
          properties:
            text_analysis_languages:
              type: array
              items:
                type: string
                enum: [en]
              description: Languages accepted by topic, sentiment and cybersecurity analysis.
              example: [en]

    StoryInputNewsItem:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          default: ""
        content:
          type: string
          default: ""
        language:
          type: string
          nullable: true
          minLength: 1
          description: Optional language code for this news item.

    TitleRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required:
            - text
        - required:
            - news_items
      properties:
        text:
          type: string
          minLength: 1
          description: Text to convert into a concise story title
        news_items:
          type: array
          description: Alternative story input used instead of `text`.
          items:
            $ref: "#/components/schemas/StoryInputNewsItem"
        language:
          type: string
          nullable: true
          minLength: 1
          description: Optional output language for the generated title.
        max_chars:
          type: integer
          minimum: 1
          default: 100
          description: Maximum allowed length of the generated title
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"

    TitleResponse:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          description: Generated title text. The model is instructed to stay within max_chars, but the service does not truncate longer outputs.

    TranslateRequest:
      type: object
      additionalProperties: false
      required:
        - text
        - target_language
      properties:
        text:
          type: string
          minLength: 1
          description: Text to translate
        target_language:
          type: string
          minLength: 1
          description: Target language code for the translation output
        source_language:
          type: string
          nullable: true
          minLength: 1
          description: Optional source language code. When omitted, local detection supplies it, with model detection for inconclusive text.
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"

    TranslateResponse:
      type: object
      additionalProperties: false
      required:
        - translation
      properties:
        translation:
          type: string
          minLength: 1
          description: Faithful translated text in the requested target language

    SummarizeRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required:
            - text
        - required:
            - news_items
      properties:
        text:
          type: string
          minLength: 1
          description: Text to summarize
        news_items:
          type: array
          description: Alternative story input used instead of `text`.
          items:
            $ref: "#/components/schemas/StoryInputNewsItem"
        language:
          type: string
          nullable: true
          minLength: 1
          description: Optional output language for the generated summary.
        max_words:
          type: integer
          minimum: 1
          description: Optional maximum number of words in the summary
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"
    SummarizeResponse:
      type: object
      additionalProperties: false
      required:
        - summary
      properties:
        summary:
          type: string
          minLength: 1
          description: Generated summary text
    NerRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Text to analyze for named entities
        cybersecurity:
          type: boolean
          default: false
          description: |
            When true, include cybersecurity-relevant entities in addition to
            general named entities.
        entity_types:
          type: array
          items:
            type: string
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"
    NerLinkRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Text to analyze and link
        cybersecurity:
          type: boolean
          default: false
        entity_types:
          type: array
          items:
            type: string
        language:
          type: string
          nullable: true
          description: Optional language code used for entity lookup.
        linking_mode:
          type: string
          nullable: true
          enum:
            - deterministic
            - llm
          description: |
            Candidate selection mode when linking is enabled.
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"
    NerResponse:
      type: object
      description: Flat map of entity values to entity types
      additionalProperties:
        type: string
    ExtractionEntityType:
      type: object
      additionalProperties: false
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
    ExtractionRelationType:
      type: object
      additionalProperties: false
      required:
        - name
        - source_types
        - target_types
      properties:
        name:
          type: string
          minLength: 1
        source_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        target_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    EntityRelationshipSchema:
      type: object
      additionalProperties: false
      required:
        - entity_types
        - relation_types
      properties:
        entity_types:
          type: array
          minItems: 1
          description: Entity type names must be unique.
          items:
            $ref: "#/components/schemas/ExtractionEntityType"
        relation_types:
          type: array
          description: |
            Relation type names must be unique. Every source_types and target_types
            value must name an entity type declared by entity_types.
          items:
            $ref: "#/components/schemas/ExtractionRelationType"
    EntityRelationshipExtractionRequest:
      type: object
      additionalProperties: false
      required:
        - text
        - schema
      properties:
        text:
          type: string
          minLength: 1
        schema:
          $ref: "#/components/schemas/EntityRelationshipSchema"
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"
    ExtractedEntity:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    ExtractedRelation:
      type: object
      additionalProperties: false
      required:
        - type
        - source_id
        - target_id
        - confidence
      properties:
        type:
          type: string
          minLength: 1
        source_id:
          type: string
          minLength: 1
        target_id:
          type: string
          minLength: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
    EntityRelationshipExtractionResponse:
      type: object
      additionalProperties: false
      required:
        - entities
        - relations
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedEntity"
        relations:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedRelation"
    GraphQueryableProperty:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        type:
          type: string
          nullable: true
          minLength: 1
        description:
          type: string
          nullable: true
          minLength: 1
    GraphNodeLabel:
      type: object
      additionalProperties: false
      required:
        - label
        - properties
      properties:
        label:
          type: string
          minLength: 1
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        properties:
          type: array
          description: Queryable properties for this node label; names must be unique.
          items:
            $ref: "#/components/schemas/GraphQueryableProperty"
    GraphRelationshipType:
      type: object
      additionalProperties: false
      required:
        - type
        - source_labels
        - target_labels
      properties:
        type:
          type: string
          minLength: 1
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        source_labels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        target_labels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        properties:
          type: array
          default: []
          description: Queryable relationship properties; names must be unique.
          items:
            $ref: "#/components/schemas/GraphQueryableProperty"
    GraphQuerySchema:
      type: object
      additionalProperties: false
      required:
        - node_labels
        - relationship_types
        - default_limit
        - maximum_limit
      properties:
        node_labels:
          type: array
          minItems: 1
          description: Allowed node labels; labels must be unique.
          items:
            $ref: "#/components/schemas/GraphNodeLabel"
        relationship_types:
          type: array
          description: |
            Allowed directed relationships. Source and target labels must reference
            labels declared in node_labels, and relationship type names must be unique.
          items:
            $ref: "#/components/schemas/GraphRelationshipType"
        default_limit:
          type: integer
          minimum: 1
          description: LIMIT used when the question does not request a smaller result count.
        maximum_limit:
          type: integer
          minimum: 1
          description: |
            Hard upper bound for the generated LIMIT. It must be greater than or
            equal to default_limit.
    GraphQueryGenerationRequest:
      type: object
      additionalProperties: false
      required:
        - question
        - graph_name
        - schema
      properties:
        question:
          type: string
          minLength: 1
        graph_name:
          type: string
          minLength: 1
          description: |
            Fixed graph name from the caller contract. It is not included in the
            generated Cypher and must be bound separately by the caller.
        schema:
          $ref: "#/components/schemas/GraphQuerySchema"
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"
    GraphQueryGenerationResponse:
      type: object
      additionalProperties: false
      required:
        - cypher
        - parameters
        - explanation
      properties:
        cypher:
          type: string
          minLength: 1
          description: Validated AGE-compatible read-only Cypher without an AGE SQL wrapper.
        parameters:
          type: object
          additionalProperties: true
          description: Values keyed by the named placeholders used in cypher.
        explanation:
          type: string
          minLength: 1
          maxLength: 500
    LinkedEntity:
      type: object
      additionalProperties: false
      required:
        - mention
        - type
      properties:
        mention:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        wikidata_qid:
          type: string
          nullable: true
        wikidata_label:
          type: string
          nullable: true
        wikidata_description:
          type: string
          nullable: true
        matched_alias:
          type: string
          nullable: true
        match_type:
          type: string
          nullable: true
        score:
          type: number
          nullable: true
        candidate_count:
          type: integer
          minimum: 0
          nullable: true
    LinkedNerResponse:
      type: object
      additionalProperties: false
      required:
        - entities
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/LinkedEntity"
    LinkRequestEntity:
      type: object
      additionalProperties: false
      required:
        - mention
        - type
      properties:
        mention:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
    LinkRequest:
      type: object
      additionalProperties: false
      required:
        - text
        - entities
      properties:
        text:
          type: string
          minLength: 1
        language:
          type: string
          nullable: true
        linking_mode:
          type: string
          nullable: true
          enum:
            - deterministic
            - llm
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"
        entities:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LinkRequestEntity"
    StoryTag:
      type: object
      required:
        - tag_type
      properties:
        name:
          type: string
        tag_type:
          type: string
      additionalProperties: true
    StoryClusterItem:
      type: object
      additionalProperties: true
      required:
        - id
        - tags
      properties:
        id:
          type: string
          minLength: 1
        tags:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StoryTag"
        summary:
          type: [string, "null"]
          default: null
    ClusterRequest:
      type: object
      additionalProperties: false
      required:
        - stories
      properties:
        stories:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StoryClusterItem"
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        thinking_budget_tokens:
          $ref: "#/components/schemas/ThinkingBudgetTokens"
    ClusterIds:
      type: object
      additionalProperties: false
      required:
        - event_clusters
      properties:
        event_clusters:
          type: array
          minItems: 1
          items:
            type: array
            items:
              type: string
    ClusterResponse:
      type: object
      additionalProperties: false
      required:
        - cluster_ids
        - message
      properties:
        cluster_ids:
          $ref: "#/components/schemas/ClusterIds"
        message:
          type: string
          minLength: 1
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string

tags:
