[project]
name = "taranis-llm-bot"
description = "Async LLM task library and bot service for Taranis AI"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE.md"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "langcodes[data]>=3.5.1",
    "niquests",
    "pydantic>=2.11.0",
    "pydantic-settings",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/taranis-ai/llm-bot"
Documentation = "https://github.com/taranis-ai/llm-bot#readme"

[project.optional-dependencies]
server = [
    "granian",
    "quart>=0.20.0",
]
dev = [
    "pre-commit>=4.6.2",
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
    "ruff",
]

[build-system]
requires = [
    "setuptools>=77",
    "setuptools_scm>=8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0.0"
tag_regex = '^([0-9]+\.[0-9]+\.[0-9]+)$'
local_scheme = "no-local-version"

[tool.setuptools]
packages = ["llm_bot", "llm_bot.prompts", "llm_bot.tasks"]

[tool.setuptools.package-data]
llm_bot = ["prompts/*.txt", "openapi3_1.yml", "py.typed"]

[tool.ruff]
line-length = 142
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "error:Field name .* shadows an attribute:UserWarning",
]
asyncio_mode = "auto"
